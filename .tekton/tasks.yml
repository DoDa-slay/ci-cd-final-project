apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: docker.io/library/alpine:3
      workingDir: $(workspaces.source.path)
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Removing the previous checkout from ${WORKSPACE_SOURCE_PATH}"
        rm -rf -- "${WORKSPACE_SOURCE_PATH:?}/repo"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nose
      type: string
      default: "-v"
  steps:
    - name: nosetests
      image: docker.io/library/python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: NOSE_ARGS
          value: $(params.args)
      script: |
        #!/bin/sh
        set -efu
        python -m venv /tmp/nose-venv
        /tmp/nose-venv/bin/pip install --upgrade pip wheel 'setuptools<81'
        /tmp/nose-venv/bin/pip install -r requirements.txt
        /tmp/nose-venv/bin/nosetests $NOSE_ARGS
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fetch-source
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  steps:
    - name: clone
      image: docker.io/library/python:3.9
      workingDir: $(workspaces.source.path)
      env:
        - name: REPO_URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
      script: |
        #!/bin/sh
        set -eu
        git init repo
        git -c safe.directory="$PWD/repo" -C repo fetch --depth=1 "$REPO_URL" "$REVISION"
        git -c safe.directory="$PWD/repo" -C repo checkout --detach FETCH_HEAD
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: docker.io/library/python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/lint-venv
        /tmp/lint-venv/bin/pip install 'flake8==4.0.1'
        /tmp/lint-venv/bin/flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
        /tmp/lint-venv/bin/flake8 service --count --max-complexity=10 --max-line-length=127 --statistics
